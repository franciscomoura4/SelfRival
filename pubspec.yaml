name: selfrival
description: A flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management (MVVM)
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.2.0
  
  # UI & Visualization
  fl_chart: ^0.66.0

  # Device Capabilities
  geolocator: ^12.0.0
  sensors_plus: ^5.0.1

  # Lightweight Maps (Replaces google_maps_flutter)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # REST API
  http: ^1.2.0

  # Audio Feedback
  flutter_tts: ^4.0.2

  # Firebase
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true